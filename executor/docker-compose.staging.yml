# Staging stack: isolated Postgres + Redis + both backends + the queue worker.
# NODE_ENV=staging everywhere, so the public directory API (/api/v1/public/*)
# is mounted and the demo seeders are allowed to run. Data lives in its own
# volumes — staging never touches production data.
#
# Only the user API is published, via the host's reverse proxy:
#   https://dev-api.haannaa.com -> user-backend:3004
# The admin API has no public domain yet — it stays on the internal network
# (reachable through `docker compose -f docker-compose.staging.yml exec ...`
# for migrations and seeders).
#
# Run from executor/:
#   cp .env.staging.example .env.staging   # fill in secrets
#   docker compose --env-file .env.staging -f docker-compose.staging.yml up -d --build
#   docker compose --env-file .env.staging -f docker-compose.staging.yml run --rm admin-backend npm run db:migrate
#   docker compose --env-file .env.staging -f docker-compose.staging.yml run --rm admin-backend npm run db:seed
#
# `name:` namespaces this stack as its own compose project so it never merges
# with the production `executor` project running on the same host (compose
# otherwise defaults the project name to the directory name).
name: haannaa-staging

services:
  postgres:
    image: postgres:15-alpine
    container_name: haannaa-staging-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-haannaa-staging-db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in executor/.env.staging}
    # No published port — internal network only.
    # Host access for psql: docker exec -it haannaa-staging-postgres psql -U postgres
    volumes:
      - staging_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-haannaa-staging-db}"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks:
      - haannaa-staging

  redis:
    image: redis:7-alpine
    container_name: haannaa-staging-redis
    restart: always
    # Password-protected, no published port — internal network only
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in executor/.env.staging}", "--appendonly", "yes"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?set REDIS_PASSWORD in executor/.env.staging}
    volumes:
      - staging_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks:
      - haannaa-staging

  user-backend:
    build:
      context: ../user-backend
      dockerfile: Dockerfile.production
    container_name: haannaa-staging-user-backend
    restart: always
    env_file:
      - ../user-backend/.env.staging
    environment:
      NODE_ENV: staging
      # Use the unique container names as hosts — the generic service names
      # (postgres/redis) can resolve to OTHER projects' containers through the
      # shared proxy network.
      DB_WRITE_HOST: haannaa-staging-postgres
      DB_NAME: ${POSTGRES_DB:-haannaa-staging-db}
      DB_USERNAME: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in executor/.env.staging}
      REDIS_HOST: haannaa-staging-redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in executor/.env.staging}
      PORT: 3004
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - haannaa-staging
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${PROXY_NETWORK:-coolify}"
      - "traefik.http.routers.haannaa-staging-user-api.rule=Host(`${STAGING_USER_API_HOST:?set STAGING_USER_API_HOST in executor/.env.staging}`)"
      - "traefik.http.routers.haannaa-staging-user-api.entrypoints=https"
      - "traefik.http.routers.haannaa-staging-user-api.tls=true"
      - "traefik.http.routers.haannaa-staging-user-api.tls.certresolver=letsencrypt"
      - "traefik.http.services.haannaa-staging-user-api.loadbalancer.server.port=3004"

  # Schema owner: migrations + seeders run from this container. No public
  # domain for now — internal network only.
  admin-backend:
    build:
      context: ../admin-backend
      dockerfile: Dockerfile.production
    container_name: haannaa-staging-admin-backend
    restart: always
    env_file:
      - ../admin-backend/.env.staging
    environment:
      NODE_ENV: staging
      DB_WRITE_HOST: haannaa-staging-postgres
      DB_NAME: ${POSTGRES_DB:-haannaa-staging-db}
      DB_USERNAME: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in executor/.env.staging}
      REDIS_HOST: haannaa-staging-redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in executor/.env.staging}
      PORT: 3006
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - haannaa-staging

  # Same admin-backend image; boots ALL queue consumers from the registry
  admin-backend-worker:
    build:
      context: ../admin-backend
      dockerfile: Dockerfile.production
    container_name: haannaa-staging-admin-backend-worker
    restart: always
    env_file:
      - ../admin-backend/.env.staging
    environment:
      NODE_ENV: staging
      DB_WRITE_HOST: haannaa-staging-postgres
      DB_NAME: ${POSTGRES_DB:-haannaa-staging-db}
      DB_USERNAME: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in executor/.env.staging}
      REDIS_HOST: haannaa-staging-redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in executor/.env.staging}
    command: ["npm", "run", "worker"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - haannaa-staging

volumes:
  staging_postgres_data:
  staging_redis_data:

networks:
  haannaa-staging:
    name: haannaa-staging
    driver: bridge
  # The host reverse proxy (Coolify's traefik) lives on this shared external
  # network; user-backend joins it so the Host rule above is reachable.
  proxy:
    external: true
    name: ${PROXY_NETWORK:-coolify}
